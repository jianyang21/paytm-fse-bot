[project]
name = "paytm-teammates"
version = "0.1.0"
description = "Autonomous AI Teammates (Paytm hackathon, Track 3)"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "redis>=5", "flask>=3", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "fakeredis[lua]>=2.20"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

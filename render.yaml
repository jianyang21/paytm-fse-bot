services:
  - type: web
    name: fse-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m teammates.fse.bot
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.3
      - key: SARVAM_API_KEY
        sync: false
      - key: VONAGE_API_KEY
        sync: false
      - key: VONAGE_API_SECRET
        sync: false
      # Vonage dashboard > Settings > signature secret: signed WhatsApp from merchants -> support
      - key: VONAGE_SIGNATURE_SECRET
        sync: false
      - key: FSE_PHONE
        sync: false
      - key: ALERT_PHONE
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      # Collections manager: 9 am brief email + /collections approval inbox
      - key: RESEND_API_KEY
        sync: false
      - key: MANAGER_EMAIL
        sync: false
      - key: MANAGER_TOKEN
        sync: false
      - key: BRIEF_FROM
        sync: false
      # Support desk: /support review queue logins
      - key: SUPPORT_KAM_EMAIL
        sync: false
      - key: SUPPORT_KAM_TOKEN
        sync: false
      - key: SUPPORT_AGENT_EMAIL
        sync: false
      - key: SUPPORT_AGENT_TOKEN
        sync: false
      # KAM digest: outbox (default) or resend
      - key: KAM_DELIVERY
        sync: false
